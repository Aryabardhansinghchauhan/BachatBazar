version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: bachat-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bachat-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/bachat_bazar
      - JWT_SECRET=bachat_bazar_super_secure_jwt_secret_key_2026_india
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile
    container_name: bachat-data-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/bachat_bazar
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bachat-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
